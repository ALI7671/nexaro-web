<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="pages.forStores.title">Nexaro</title>
  <meta name="description" content="" data-i18n-attr="content:pages.forStores.description">
  <meta name="theme-color" content="#0A0909">
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <script>(function () { var l = 'ar'; try { var p = new URLSearchParams(location.search).get('lang'); l = p === 'en' || p === 'ar' ? p : (localStorage.getItem('nexaro.lang') === 'en' ? 'en' : 'ar'); } catch (e) {} document.documentElement.lang = l; document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr'; })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500&family=Montserrat:wght@200;300;400;500&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/pages/for-stores.js"></script>
</head>
<body data-nav="for-stores">
  <a class="skip-link" href="#main" data-i18n="a11y.skip"></a>
  <header class="site-header" id="site-header"></header>

  <main id="main" tabindex="-1">
    <div class="page-head container">
      <p class="eyebrow" data-i18n="forStores.eyebrow"></p>
      <h1 class="page-title" data-i18n="forStores.title"></h1>
      <p class="lead" data-i18n="forStores.intro"></p>
      <div class="btn-row mt-lg">
        <a class="btn btn--solid" href="#apply" data-i18n="forStores.ctaApply"></a>
        <a class="btn" id="stores-whatsapp" href="/contact" target="_blank" rel="noopener"><span data-icon="chat"></span><span data-i18n="forStores.ctaWhatsapp"></span></a>
      </div>
    </div>

    <section class="section section--line container" aria-labelledby="benefits-title">
      <div class="section-head reveal">
        <div>
          <p class="eyebrow" data-i18n="forStores.benefitsEyebrow"></p>
          <h2 class="section-title" id="benefits-title" data-i18n="forStores.benefitsTitle"></h2>
        </div>
      </div>
      <ul class="info-grid info-grid--4">
        <li class="info-item reveal" style="--i:0"><h3 class="info-item__title" data-i18n="forStores.benefit1Title"></h3><p class="info-item__text" data-i18n="forStores.benefit1Text"></p></li>
        <li class="info-item reveal" style="--i:1"><h3 class="info-item__title" data-i18n="forStores.benefit2Title"></h3><p class="info-item__text" data-i18n="forStores.benefit2Text"></p></li>
        <li class="info-item reveal" style="--i:2"><h3 class="info-item__title" data-i18n="forStores.benefit3Title"></h3><p class="info-item__text" data-i18n="forStores.benefit3Text"></p></li>
        <li class="info-item reveal" style="--i:3"><h3 class="info-item__title" data-i18n="forStores.benefit4Title"></h3><p class="info-item__text" data-i18n="forStores.benefit4Text"></p></li>
      </ul>
    </section>

    <section class="section section--line container" aria-labelledby="store-steps-title">
      <div class="section-head reveal">
        <div>
          <p class="eyebrow" data-i18n="forStores.stepsEyebrow"></p>
          <h2 class="section-title" id="store-steps-title" data-i18n="forStores.stepsTitle"></h2>
        </div>
      </div>
      <ol class="info-grid info-grid--3">
        <li class="info-item reveal" style="--i:0"><span class="info-item__num">01</span><h3 class="info-item__title" data-i18n="forStores.step1Title"></h3><p class="info-item__text" data-i18n="forStores.step1Text"></p></li>
        <li class="info-item reveal" style="--i:1"><span class="info-item__num">02</span><h3 class="info-item__title" data-i18n="forStores.step2Title"></h3><p class="info-item__text" data-i18n="forStores.step2Text"></p></li>
        <li class="info-item reveal" style="--i:2"><span class="info-item__num">03</span><h3 class="info-item__title" data-i18n="forStores.step3Title"></h3><p class="info-item__text" data-i18n="forStores.step3Text"></p></li>
      </ol>
    </section>

    <section class="section section--line container" id="apply" aria-labelledby="join-form-title">
      <div class="split split--wide-end">
        <div class="reveal">
          <p class="eyebrow" data-i18n="forStores.applyEyebrow"></p>
          <h2 class="page-title story__title mt-lg" data-i18n="forStores.applyTitle"></h2>
          <p class="lead muted mt-lg" data-i18n="forStores.applyText"></p>
        </div>

        <div class="reveal">
          <h2 class="section-title form-title" id="join-form-title" data-i18n="join.formTitle"></h2>

          <form class="form" id="join-form" novalidate>
            <div class="form__row">
              <div class="field">
                <label class="field__label" for="store-name" data-i18n="join.storeName"></label>
                <input class="field__input" id="store-name" name="storeName" type="text" autocomplete="organization" maxlength="80" required aria-describedby="store-name-error">
                <p class="field__error" id="store-name-error" hidden></p>
              </div>
              <div class="field">
                <label class="field__label" for="owner-name" data-i18n="join.ownerName"></label>
                <input class="field__input" id="owner-name" name="ownerName" type="text" autocomplete="name" maxlength="80" required aria-describedby="owner-name-error">
                <p class="field__error" id="owner-name-error" hidden></p>
              </div>
            </div>

            <div class="form__row">
              <div class="field">
                <label class="field__label" for="store-city" data-i18n="join.city"></label>
                <input class="field__input" id="store-city" name="city" type="text" list="city-options" autocomplete="address-level2" maxlength="60" required aria-describedby="store-city-error">
                <datalist id="city-options"></datalist>
                <p class="field__error" id="store-city-error" hidden></p>
              </div>
              <div class="field">
                <label class="field__label" for="store-phone" data-i18n="join.phone"></label>
                <input class="field__input" id="store-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" maxlength="20" required aria-describedby="store-phone-hint store-phone-error">
                <p class="field__hint" id="store-phone-hint" data-i18n="join.phoneHint"></p>
                <p class="field__error" id="store-phone-error" hidden></p>
              </div>
            </div>

            <div class="field">
              <label class="field__label" for="store-instagram"><span data-i18n="join.instagram"></span> <span class="field__optional" data-i18n="form.optional"></span></label>
              <input class="field__input" id="store-instagram" name="instagram" type="text" inputmode="url" autocomplete="url" dir="ltr" maxlength="120" aria-describedby="store-instagram-hint store-instagram-error">
              <p class="field__hint" id="store-instagram-hint" data-i18n="join.instagramHint"></p>
              <p class="field__error" id="store-instagram-error" hidden></p>
            </div>

            <div class="field">
              <label class="field__label" for="store-message"><span data-i18n="join.message"></span> <span class="field__optional" data-i18n="form.optional"></span></label>
              <textarea class="field__textarea" id="store-message" name="message" maxlength="1000" data-i18n-attr="placeholder:join.messagePlaceholder"></textarea>
            </div>

            <p class="field__error" id="join-form-error" role="alert" hidden></p>
            <button class="btn btn--solid btn--block" type="submit" data-i18n="join.submit"></button>
            <p class="form__note"><span data-i18n="join.privacy"></span> <a class="text-link" href="/privacy" data-i18n="footer.privacy"></a></p>
          </form>

          <div class="success-panel" id="join-success" role="status" hidden>
            <p class="eyebrow" data-i18n="join.successEyebrow"></p>
            <h2 class="section-title" tabindex="-1" data-i18n="join.successTitle"></h2>
            <p class="muted" data-i18n="join.successText"></p>
            <a class="link-arrow" href="/"><span data-i18n="join.successCta"></span><span data-icon="arrow"></span></a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
</body>
</html>
