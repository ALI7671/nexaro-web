<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="pages.signup.title">Nexaro</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0A0909">
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/images/icons/apple-touch-icon.png">
  <!-- Language, direction and theme are set here, before anything paints (no flash) -->
  <script>(function () { var d = document.documentElement, l = 'ar', t = 'dark'; try { var p = new URLSearchParams(location.search).get('lang'); l = p === 'en' || p === 'ar' ? p : (localStorage.getItem('nexaro.lang') === 'en' ? 'en' : 'ar'); t = localStorage.getItem('nexaro.theme') === 'light' ? 'light' : 'dark'; } catch (e) {} d.lang = l; d.dir = l === 'ar' ? 'rtl' : 'ltr'; d.setAttribute('data-theme', t); var m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = t === 'light' ? '#F5F3F0' : '#0A0909'; })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500&family=Montserrat:wght@200;300;400;500&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/pages/signup.js"></script>
</head>
<body data-nav="signup">
  <a class="skip-link" href="#main" data-i18n="a11y.skip"></a>
  <header class="site-header" id="site-header"></header>

  <main id="main" tabindex="-1">
    <section class="auth-page container">
      <div class="auth-card auth-card--wide">
        <p class="eyebrow" data-i18n="auth.signupEyebrow"></p>
        <h1 class="page-title auth-title" data-i18n="auth.signupTitle"></h1>
        <p class="muted auth-intro" data-i18n="auth.signupIntro"></p>

        <form class="form" id="signup-form" novalidate>
          <div class="field">
            <label class="field__label" for="signup-name" data-i18n="auth.fullName"></label>
            <input class="field__input" id="signup-name" name="fullName" type="text" autocomplete="name" maxlength="100" required aria-describedby="signup-name-error">
            <p class="field__error" id="signup-name-error" hidden></p>
          </div>
          <div class="form__row">
            <div class="field">
              <label class="field__label" for="signup-phone" data-i18n="auth.phone"></label>
              <input class="field__input" id="signup-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" maxlength="20" required aria-describedby="signup-phone-hint signup-phone-error">
              <p class="field__hint" id="signup-phone-hint" data-i18n="auth.phoneHint"></p>
              <p class="field__error" id="signup-phone-error" hidden></p>
            </div>
            <div class="field">
              <label class="field__label" for="signup-city" data-i18n="auth.city"></label>
              <input class="field__input" id="signup-city" name="city" type="text" list="city-options" autocomplete="address-level2" maxlength="60" required aria-describedby="signup-city-error">
              <datalist id="city-options"></datalist>
              <p class="field__error" id="signup-city-error" hidden></p>
            </div>
          </div>
          <div class="field">
            <label class="field__label" for="signup-email" data-i18n="auth.email"></label>
            <input class="field__input" id="signup-email" name="email" type="email" autocomplete="email" dir="ltr" required aria-describedby="signup-email-error">
            <p class="field__error" id="signup-email-error" hidden></p>
          </div>
          <div class="field">
            <label class="field__label" for="signup-password" data-i18n="auth.password"></label>
            <input class="field__input" id="signup-password" name="password" type="password" autocomplete="new-password" dir="ltr" required aria-describedby="signup-password-hint signup-password-error">
            <p class="field__hint" id="signup-password-hint" data-i18n="auth.passwordHint"></p>
            <p class="field__error" id="signup-password-error" hidden></p>
          </div>
          <p class="field__error" id="signup-error" role="alert" hidden></p>
          <button class="btn btn--solid btn--block" type="submit" data-i18n="auth.signupSubmit"></button>
          <p class="form__note">
            <span data-i18n="auth.termsBefore"></span>
            <a class="text-link" href="/terms" data-i18n="footer.terms"></a><span data-i18n="auth.termsAnd"></span><a class="text-link" href="/privacy" data-i18n="footer.privacy"></a>.
          </p>
        </form>

        <div class="success-panel" id="signup-done" role="status" tabindex="-1" hidden>
          <p class="eyebrow" data-i18n="auth.signupEyebrow"></p>
          <h2 class="section-title" data-i18n="auth.checkEmailTitle"></h2>
          <p class="muted" id="signup-done-text"></p>
          <a class="link-arrow" href="/login"><span data-i18n="auth.backToLogin"></span><span data-icon="arrow"></span></a>
        </div>

        <div class="auth-alt">
          <p><span data-i18n="auth.haveAccount"></span> <a class="text-link" href="/login" data-i18n="auth.signIn"></a></p>
          <p><span data-i18n="auth.storeOwner"></span> <a class="text-link" href="/store-signup" data-i18n="auth.storeSignupLink"></a></p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
</body>
</html>
