<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="pages.about.title">Nexaro</title>
  <meta name="description" content="" data-i18n-attr="content:pages.about.description">
  <meta name="theme-color" content="#0A0909">
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <script>(function () { var l = 'ar'; try { var p = new URLSearchParams(location.search).get('lang'); l = p === 'en' || p === 'ar' ? p : (localStorage.getItem('nexaro.lang') === 'en' ? 'en' : 'ar'); } catch (e) {} document.documentElement.lang = l; document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr'; })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500&family=Montserrat:wght@200;300;400;500&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/pages/static.js"></script>
</head>
<body data-nav="about">
  <a class="skip-link" href="#main" data-i18n="a11y.skip"></a>
  <header class="site-header" id="site-header"></header>

  <main id="main" tabindex="-1">
    <div class="page-head container">
      <p class="eyebrow" data-i18n="about.eyebrow"></p>
      <h1 class="page-title" data-i18n="about.title"></h1>
      <p class="lead" data-i18n="about.lead"></p>
    </div>

    <section class="section section--line container" aria-labelledby="story-title">
      <div class="split">
        <h2 class="section-title reveal" id="story-title" data-i18n="about.storyTitle"></h2>
        <div class="prose reveal">
          <p data-i18n="about.p1"></p>
          <p data-i18n="about.p2"></p>
          <p data-i18n="about.p3"></p>
        </div>
      </div>
    </section>

    <section class="section section--line container" aria-labelledby="values-title">
      <div class="section-head reveal">
        <div>
          <p class="eyebrow" data-i18n="about.valuesEyebrow"></p>
          <h2 class="section-title" id="values-title" data-i18n="about.valuesTitle"></h2>
        </div>
      </div>
      <ul class="info-grid info-grid--3">
        <li class="info-item reveal" style="--i:0"><h3 class="info-item__title" data-i18n="about.value1Title"></h3><p class="info-item__text" data-i18n="about.value1Text"></p></li>
        <li class="info-item reveal" style="--i:1"><h3 class="info-item__title" data-i18n="about.value2Title"></h3><p class="info-item__text" data-i18n="about.value2Text"></p></li>
        <li class="info-item reveal" style="--i:2"><h3 class="info-item__title" data-i18n="about.value3Title"></h3><p class="info-item__text" data-i18n="about.value3Text"></p></li>
      </ul>
    </section>

    <section class="section section--line container" aria-labelledby="base-title">
      <div class="split">
        <div class="reveal">
          <p class="eyebrow" data-i18n="about.baseEyebrow"></p>
          <h2 class="page-title story__title mt-lg" id="base-title" data-i18n="about.baseTitle"></h2>
        </div>
        <div class="prose reveal">
          <p class="lead" data-i18n="about.baseText"></p>
        </div>
      </div>
    </section>

    <section class="section section--line container cta-band reveal" aria-labelledby="about-cta-title">
      <h2 class="page-title" id="about-cta-title" data-i18n="about.ctaTitle"></h2>
      <div class="btn-row">
        <a class="btn btn--solid" href="/shop" data-i18n="about.ctaShop"></a>
        <a class="btn" href="/stores" data-i18n="about.ctaStores"></a>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
</body>
</html>
