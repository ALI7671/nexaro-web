<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="pages.sizeGuide.title">Nexaro</title>
  <meta name="description" content="" data-i18n-attr="content:pages.sizeGuide.description">
  <meta name="theme-color" content="#0A0909">
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <script>(function () { var l = 'ar'; try { var p = new URLSearchParams(location.search).get('lang'); l = p === 'en' || p === 'ar' ? p : (localStorage.getItem('nexaro.lang') === 'en' ? 'en' : 'ar'); } catch (e) {} document.documentElement.lang = l; document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr'; })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500&family=Montserrat:wght@200;300;400;500&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/pages/size-guide.js"></script>
</head>
<body data-nav="size-guide">
  <a class="skip-link" href="#main" data-i18n="a11y.skip"></a>
  <header class="site-header" id="site-header"></header>

  <main id="main" tabindex="-1">
    <div class="page-head container">
      <p class="eyebrow" data-i18n="sizeGuide.eyebrow"></p>
      <h1 class="page-title" data-i18n="sizeGuide.title"></h1>
      <p class="lead" data-i18n="sizeGuide.intro"></p>
      <nav class="pill-row mt-lg" data-i18n-attr="aria-label:sizeGuide.jumpLabel">
        <a class="pill" href="#tops" data-i18n="sizeGuide.tops"></a>
        <a class="pill" href="#pants" data-i18n="sizeGuide.pants"></a>
        <a class="pill" href="#shoes" data-i18n="sizeGuide.shoes"></a>
      </nav>
    </div>

    <section class="section section--line container" aria-labelledby="measure-title">
      <h2 class="section-title reveal" id="measure-title" data-i18n="sizeGuide.howTitle"></h2>
      <ul class="info-grid info-grid--4 mt-lg">
        <li class="info-item reveal" style="--i:0"><h3 class="info-item__title" data-i18n="sizeGuide.chestTitle"></h3><p class="info-item__text" data-i18n="sizeGuide.chestText"></p></li>
        <li class="info-item reveal" style="--i:1"><h3 class="info-item__title" data-i18n="sizeGuide.waistTitle"></h3><p class="info-item__text" data-i18n="sizeGuide.waistText"></p></li>
        <li class="info-item reveal" style="--i:2"><h3 class="info-item__title" data-i18n="sizeGuide.inseamTitle"></h3><p class="info-item__text" data-i18n="sizeGuide.inseamText"></p></li>
        <li class="info-item reveal" style="--i:3"><h3 class="info-item__title" data-i18n="sizeGuide.footTitle"></h3><p class="info-item__text" data-i18n="sizeGuide.footText"></p></li>
      </ul>
    </section>

    <section class="section section--line container">
      <div class="size-section" id="tops">
        <h2 class="section-title" id="tops-title" data-i18n="sizeGuide.tops"></h2>
        <div class="table-wrap" role="region" tabindex="0" aria-labelledby="tops-title">
          <table class="size-table" aria-labelledby="tops-title">
            <thead>
              <tr>
                <th scope="col" data-i18n="sizeGuide.colSize"></th>
                <th scope="col" data-i18n="sizeGuide.colChest"></th>
                <th scope="col" data-i18n="sizeGuide.colLength"></th>
                <th scope="col" data-i18n="sizeGuide.colSleeve"></th>
              </tr>
            </thead>
            <tbody>
              <tr><th scope="row">S</th><td>92–96</td><td>71</td><td>62</td></tr>
              <tr><th scope="row">M</th><td>97–102</td><td>73</td><td>63</td></tr>
              <tr><th scope="row">L</th><td>103–108</td><td>75</td><td>64</td></tr>
              <tr><th scope="row">XL</th><td>109–114</td><td>77</td><td>65</td></tr>
              <tr><th scope="row">XXL</th><td>115–120</td><td>79</td><td>66</td></tr>
            </tbody>
          </table>
        </div>
        <p class="size-note" data-i18n="sizeGuide.unitNote"></p>
      </div>

      <div class="size-section" id="pants">
        <h2 class="section-title" id="pants-title" data-i18n="sizeGuide.pants"></h2>
        <div class="table-wrap" role="region" tabindex="0" aria-labelledby="pants-title">
          <table class="size-table" aria-labelledby="pants-title">
            <thead>
              <tr>
                <th scope="col" data-i18n="sizeGuide.colWaistIn"></th>
                <th scope="col" data-i18n="sizeGuide.colWaist"></th>
                <th scope="col" data-i18n="sizeGuide.colHip"></th>
                <th scope="col" data-i18n="sizeGuide.colInseam"></th>
              </tr>
            </thead>
            <tbody>
              <tr><th scope="row">28</th><td>71</td><td>88</td><td>81</td></tr>
              <tr><th scope="row">30</th><td>76</td><td>93</td><td>81</td></tr>
              <tr><th scope="row">32</th><td>81</td><td>98</td><td>82</td></tr>
              <tr><th scope="row">34</th><td>86</td><td>103</td><td>82</td></tr>
              <tr><th scope="row">36</th><td>91</td><td>108</td><td>83</td></tr>
              <tr><th scope="row">38</th><td>97</td><td>113</td><td>83</td></tr>
            </tbody>
          </table>
        </div>
        <p class="size-note" data-i18n="sizeGuide.unitNote"></p>
      </div>

      <div class="size-section" id="shoes">
        <h2 class="section-title" id="shoes-title" data-i18n="sizeGuide.shoes"></h2>
        <div class="table-wrap" role="region" tabindex="0" aria-labelledby="shoes-title">
          <table class="size-table" aria-labelledby="shoes-title">
            <thead>
              <tr>
                <th scope="col">EU</th>
                <th scope="col">UK</th>
                <th scope="col">US</th>
                <th scope="col" data-i18n="sizeGuide.colFoot"></th>
              </tr>
            </thead>
            <tbody>
              <tr><th scope="row">39</th><td>5.5</td><td>6.5</td><td>24.6</td></tr>
              <tr><th scope="row">40</th><td>6.5</td><td>7</td><td>25.3</td></tr>
              <tr><th scope="row">41</th><td>7</td><td>8</td><td>25.9</td></tr>
              <tr><th scope="row">42</th><td>8</td><td>8.5</td><td>26.6</td></tr>
              <tr><th scope="row">43</th><td>9</td><td>9.5</td><td>27.3</td></tr>
              <tr><th scope="row">44</th><td>9.5</td><td>10</td><td>27.9</td></tr>
              <tr><th scope="row">45</th><td>10.5</td><td>11</td><td>28.6</td></tr>
            </tbody>
          </table>
        </div>
        <p class="size-note" data-i18n="sizeGuide.tip"></p>
      </div>
    </section>

    <section class="section section--line container cta-band reveal" aria-labelledby="size-help-title">
      <h2 class="page-title" id="size-help-title" data-i18n="sizeGuide.askTitle"></h2>
      <p class="lead" data-i18n="sizeGuide.askText"></p>
      <div class="btn-row">
        <a class="btn" id="size-help" href="/contact" target="_blank" rel="noopener"><span data-icon="chat"></span><span data-i18n="sizeGuide.askCta"></span></a>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
</body>
</html>
