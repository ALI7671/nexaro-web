<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="pages.terms.title">Nexaro</title>
  <meta name="description" content="" data-i18n-attr="content:pages.terms.description">
  <meta name="theme-color" content="#0A0909">
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/images/icons/apple-touch-icon.png">
  <!-- Language, direction and theme are set here, before anything paints (no flash) -->
  <script>(function () { var d = document.documentElement, l = 'ar', t = 'dark'; try { var p = new URLSearchParams(location.search).get('lang'); l = p === 'en' || p === 'ar' ? p : (localStorage.getItem('nexaro.lang') === 'en' ? 'en' : 'ar'); t = localStorage.getItem('nexaro.theme') === 'light' ? 'light' : 'dark'; } catch (e) {} d.lang = l; d.dir = l === 'ar' ? 'rtl' : 'ltr'; d.setAttribute('data-theme', t); var m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = t === 'light' ? '#F5F3F0' : '#0A0909'; })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500&family=Montserrat:wght@200;300;400;500&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/pages/legal.js"></script>
</head>
<body data-nav="terms" data-doc="terms">
  <a class="skip-link" href="#main" data-i18n="a11y.skip"></a>
  <header class="site-header" id="site-header"></header>

  <main id="main" tabindex="-1">
    <div class="page-head container">
      <p class="draft-note" role="note"><strong data-i18n="legal.draft"></strong> <span data-i18n="legal.draftText"></span></p>
      <p class="eyebrow" data-i18n="legal.terms.eyebrow"></p>
      <h1 class="page-title" data-i18n="legal.terms.title"></h1>
      <p class="lead" data-i18n="legal.terms.intro"></p>
      <p class="legal-updated" data-i18n="legal.updated"></p>
    </div>

    <!-- Filled by js/pages/legal.js from legal.terms.sections in the i18n files -->
    <div class="container section-bottom legal" id="legal-root"></div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
</body>
</html>
