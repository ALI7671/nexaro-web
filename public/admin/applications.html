<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="pages.admin.title">Nexaro</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0A0909">
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <script>(function () { var l = 'ar'; try { var p = new URLSearchParams(location.search).get('lang'); l = p === 'en' || p === 'ar' ? p : (localStorage.getItem('nexaro.lang') === 'en' ? 'en' : 'ar'); } catch (e) {} document.documentElement.lang = l; document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr'; })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500&family=Montserrat:wght@200;300;400;500&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/pages/admin-applications.js"></script>
</head>
<body data-nav="admin">
  <a class="skip-link" href="#main" data-i18n="a11y.skip"></a>
  <header class="site-header" id="site-header"></header>

  <!-- Admins only. The page redirects others to /login, but the real lock is in the
       database: Row Level Security only returns applications to admins, and
       review_application() refuses anyone who isn't an admin. -->
  <main id="main" tabindex="-1">
    <div class="page-head container">
      <p class="eyebrow" data-i18n="admin.eyebrow"></p>
      <h1 class="page-title" data-i18n="admin.title"></h1>
    </div>

    <section class="container section-bottom" aria-labelledby="admin-list-title">
      <h2 class="sr-only" id="admin-list-title" data-i18n="admin.title"></h2>
      <div class="pill-row" id="status-filter" role="group" data-i18n-attr="aria-label:admin.filterLabel"></div>
      <p class="sr-only" id="admin-status" role="status"></p>
      <p class="field__error mt-lg" id="admin-error" role="alert" hidden></p>
      <div class="application-list mt-lg" id="application-list"></div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
</body>
</html>
