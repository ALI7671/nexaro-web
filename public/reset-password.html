<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="pages.resetPassword.title">Nexaro</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0A0909">
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/images/icons/apple-touch-icon.png">
  <!-- Language, direction and theme are set here, before anything paints (no flash) -->
  <script>(function () { var d = document.documentElement, l = 'ar', t = 'dark'; try { var p = new URLSearchParams(location.search).get('lang'); l = p === 'en' || p === 'ar' ? p : (localStorage.getItem('nexaro.lang') === 'en' ? 'en' : 'ar'); t = localStorage.getItem('nexaro.theme') === 'light' ? 'light' : 'dark'; } catch (e) {} d.lang = l; d.dir = l === 'ar' ? 'rtl' : 'ltr'; d.setAttribute('data-theme', t); var m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = t === 'light' ? '#F5F3F0' : '#0A0909'; })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500&family=Montserrat:wght@200;300;400;500&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/pages/reset-password.js"></script>
</head>
<body data-nav="login">
  <a class="skip-link" href="#main" data-i18n="a11y.skip"></a>
  <header class="site-header" id="site-header"></header>

  <!-- The "forgot password" email links here, with a one-time login in the URL -->
  <main id="main" tabindex="-1">
    <section class="auth-page container">
      <div class="auth-card">
        <p class="eyebrow" data-i18n="auth.loginEyebrow"></p>
        <h1 class="page-title auth-title" data-i18n="auth.resetTitle"></h1>

        <form class="form" id="new-password-form" novalidate hidden>
          <div class="field">
            <label class="field__label" for="new-password" data-i18n="auth.newPassword"></label>
            <input class="field__input" id="new-password" name="password" type="password" autocomplete="new-password" dir="ltr" required aria-describedby="new-password-hint new-password-error">
            <p class="field__hint" id="new-password-hint" data-i18n="auth.passwordHint"></p>
            <p class="field__error" id="new-password-error" hidden></p>
          </div>
          <div class="field">
            <label class="field__label" for="confirm-password" data-i18n="auth.confirmPassword"></label>
            <input class="field__input" id="confirm-password" name="confirm" type="password" autocomplete="new-password" dir="ltr" required aria-describedby="confirm-password-error">
            <p class="field__error" id="confirm-password-error" hidden></p>
          </div>
          <p class="field__error" id="new-password-form-error" role="alert" hidden></p>
          <button class="btn btn--solid btn--block" type="submit" data-i18n="auth.resetSave"></button>
        </form>

        <div class="auth-message" id="reset-result" role="status" hidden>
          <p class="lead" id="reset-result-text"></p>
          <a class="link-arrow" id="reset-result-link" href="/login"><span id="reset-result-label"></span><span data-icon="arrow"></span></a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
</body>
</html>
